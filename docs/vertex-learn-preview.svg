  <text x="72" y="180" fill="#fff" font-family="Arial" font-size="15">Overview</text>
  <g fill="#898984" font-family="Arial" font-size="15">
    <text x="43" y="235">▤</text><text x="72" y="235">My Courses</text>
    <text x="43" y="290">✦</text><text x="72" y="290">AI Tutor</text>
    <text x="43" y="345">✓</text><text x="72" y="345">Assignments</text>
    <text x="43" y="400">♢</text><text x="72" y="400">Achievements</text>
    <text x="43" y="455">⚙</text><text x="72" y="455">Settings</text>
  </g>
  <rect x="245" y="0" width="1155" height="82" fill="#0d0d0d" stroke="#282824"/>
  <text x="290" y="48" fill="#777" font-family="Arial" font-size="13">Workspace</text><text x="367" y="48" fill="#555" font-family="Arial" font-size="13"> / </text><text x="391" y="48" fill="#eee" font-family="Arial" font-size="13">Overview</text>
  <rect x="290" y="130" width="1050" height="90" rx="16" fill="url(#glow)"/>
  <text x="320" y="165" fill="#a39769" font-family="Arial" font-size="11" letter-spacing="2">SATURDAY, OCTOBER 31, 2026</text>
  <text x="320" y="202" fill="#fff" font-family="Arial" font-size="34" font-weight="700">Good morning, Jordan <tspan fill="#ffd21f">✦</tspan></text>
  <rect x="1160" y="165" width="145" height="40" rx="8" fill="#ffd21f"/>
  <text x="1183" y="190" fill="#17150b" font-family="Arial" font-size="13" font-weight="700">✦ Ask AI Tutor</text>
  <g filter="url(#shadow)">
    <rect x="290" y="250" width="250" height="130" rx="12" fill="#151513" stroke="#2d2d28"/><rect x="557" y="250" width="250" height="130" rx="12" fill="#151513" stroke="#2d2d28"/><rect x="824" y="250" width="250" height="130" rx="12" fill="#151513" stroke="#2d2d28"/><rect x="1091" y="250" width="249" height="130" rx="12" fill="#151513" stroke="#2d2d28"/>
  </g>
  <g font-family="Arial"><g fill="#999"><text x="314" y="282" font-size="13">Learning hours</text><text x="581" y="282" font-size="13">Course progress</text><text x="848" y="282" font-size="13">Current streak</text><text x="1115" y="282" font-size="13">Average score</text></g><g fill="#fff" font-size="31" font-weight="700"><text x="314" y="330">24.6<tspan fill="#999" font-size="13"> hrs</tspan></text><text x="581" y="330">48<tspan fill="#999" font-size="13">%</tspan></text><text x="848" y="330">12<tspan fill="#999" font-size="13"> days</tspan></text><text x="1115" y="330">89<tspan fill="#999" font-size="13">%</tspan></text></g></g>
  <text x="290" y="445" fill="#fff" font-family="Arial" font-size="20" font-weight="700">Continue learning</text><text x="1170" y="445" fill="#ffd21f" font-family="Arial" font-size="13">View more →</text>
  <rect x="290" y="470" width="690" height="210" rx="12" fill="#151513" stroke="#2d2d28"/><rect x="290" y="470" width="190" height="210" rx="12" fill="#4a3b0d"/><text x="345" y="570" fill="#ffd21f" font-family="Arial" font-size="62">⚛</text><text x="312" y="652" fill="#ffd21f" font-family="Arial" font-size="10" letter-spacing="2">DEVELOPMENT</text><text x="510" y="522" fill="#ffd21f" font-family="Arial" font-size="11">DEVELOPMENT · 24 LESSONS</text><text x="510" y="558" fill="#fff" font-family="Arial" font-size="19" font-weight="700">Advanced React Patterns</text><text x="510" y="584" fill="#999" font-family="Arial" font-size="12">with Maya Chen</text><rect x="510" y="625" width="405" height="6" rx="3" fill="#333329"/><rect x="510" y="625" width="275" height="6" rx="3" fill="#ffd21f"/><text x="510" y="650" fill="#ffd21f" font-family="Arial" font-size="11">View course details →</text>
  <rect x="1005" y="470" width="335" height="210" rx="12" fill="#151513" stroke="#2d2d28"/><text x="1030" y="510" fill="#fff" font-family="Arial" font-size="17" font-weight="700">Weekly activity</text><g fill="#3b3b35"><rect x="1045" y="605" width="20" height="42" rx="4"/><rect x="1090" y="580" width="20" height="67" rx="4"/><rect x="1135" y="595" width="20" height="52" rx="4"/><rect x="1180" y="550" width="20" height="97" rx="4"/><rect x="1225" y="570" width="20" height="77" rx="4"/><rect x="1270" y="530" width="20" height="117" rx="4" fill="#ffd21f"/></g>
