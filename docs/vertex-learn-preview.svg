<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc">
  <title id="title">Vertex Learn dashboard preview</title>
  <desc id="desc">Black and yellow learning dashboard with course cards, metrics, and activity chart.</desc>
  <defs>
    <linearGradient id="glow" x1="0" x2="1">
      <stop offset="0" stop-color="#16150d"/>
      <stop offset="1" stop-color="#28220b"/>
    </linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="14" stdDeviation="18" flood-opacity=".35"/></filter>
  </defs>
  <rect width="1400" height="820" rx="28" fill="#090909"/>
  <rect x="0" y="0" width="245" height="820" fill="#111"/>
  <text x="38" y="58" fill="#ffd21f" font-family="Arial" font-size="26" font-weight="700">V</text>
  <text x="73" y="58" fill="#f5f5f0" font-family="Arial" font-size="22" font-weight="700">vertex<tspan fill="#ffd21f">learn</tspan></text>
  <text x="38" y="125" fill="#777" font-family="Arial" font-size="12" letter-spacing="2">LEARNING SPACE</text>
  <rect x="19" y="150" width="207" height="48" rx="9" fill="#292612"/>
